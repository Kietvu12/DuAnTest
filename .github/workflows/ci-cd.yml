name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shophouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend syntax check
        run: npm ci && find src db -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend
      - name: Frontend build
        run: npm ci && npm run build
        working-directory: frontend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, shophouse]
    steps:
      - name: Pull, build, restart ShopHouse
        run: /home/DuAnTest/scripts/pull-and-deploy.sh
