name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          TOKEN: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "X-Deploy-Token: ${TOKEN}" \
            --max-time 1200 \
            https://shophouse.vietdemo.com/__deploy/shophouse)
          cat /tmp/r.json; echo
          test "$code" = "200"
