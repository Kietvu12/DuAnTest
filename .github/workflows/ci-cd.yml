name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shophouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Check backend
        working-directory: backend
        run: npm ci && find src db -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  deploy:
    name: Deploy server
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pull + build + restart
        env:
          TOKEN: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/deploy-resp.json -w '%{http_code}' -X POST \
            -H "X-Deploy-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}","repo":"${{ github.repository }}"}' \
            https://shophouse.vietdemo.com/__deploy/shophouse)
          cat /tmp/deploy-resp.json
          echo
          test "$code" = "202"
